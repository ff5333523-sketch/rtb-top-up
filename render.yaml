services:
  - type: web
    name: rtb-top-up
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: rtb-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/rtb-topup.sqlite
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
